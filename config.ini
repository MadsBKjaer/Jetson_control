[device]
# Name visible to host during Bluetooth discovery
name = JetsonControl

[mouse]
# Swap left/right buttons (for Windows "swap mouse buttons" setting)
swap_buttons = false

[screen]
# VNC server settings for screen capture
# IP address of the host computer
vnc_host = 127.0.0.1
# VNC port (default 5900)
vnc_port = 5900
# VNC password (leave empty if none)
vnc_password = 
